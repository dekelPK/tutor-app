name: Notify admin of a landing-page contact message

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: 'Contact message id (details are fetched from the app, never passed here)'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pywebpush

      - name: Notify admin
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: python scripts/notify_admin_contact.py
