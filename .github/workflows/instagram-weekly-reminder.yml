name: Weekly Instagram content reminder

on:
  schedule:
    # Sunday 08:xx Israel time = 05:xx UTC in summer (IDT), 06:xx UTC in winter (IST).
    # Both run; the server sends only from 08:00 local, and only once per day.
    - cron: '45 5 * * 0'
    - cron: '45 6 * * 0'
  workflow_dispatch: {}   # manual test run from the Actions tab

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pywebpush

      - name: Remind admin
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
        run: python scripts/notify_admin_instagram.py
